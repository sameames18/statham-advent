name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit and HTTP tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from "engines" in package.json, the Docker image's major,
        # and the major Vercel runs.
        node: ['22.13', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      # The unit tests need nothing installed, same as running the site.
      - run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  vercel:
    name: Vercel build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Builds the deployment offline, against a stand-in project, so a
      # broken vercel.json fails here rather than on deploy. Nothing is
      # uploaded and no Vercel account is needed.
      - run: |
          mkdir -p .vercel
          echo '{"projectId":"prj_ci","orgId":"team_ci","settings":{"framework":null}}' > .vercel/project.json
          npx --yes vercel@60 build --yes 2>&1 | tee build.log
          ! grep -q ERROR build.log
          test -f .vercel/output/functions/api/index.func/server/data/films.json
          test ! -e .vercel/output/functions/api/index.func/public
          grep -q 'og:image" content="https://stathmas.example.com/og.jpg"' .vercel/output/static/index.html
        env:
          VERCEL_TELEMETRY_DISABLED: '1'
          # As Vercel would provide it, so the link-preview address is checked too.
          VERCEL_PROJECT_PRODUCTION_URL: stathmas.example.com
