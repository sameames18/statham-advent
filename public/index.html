<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stathmas</title>
  <meta name="description" content="A Christmas advent calendar. Thirty-one doors, one for each night of December.">
  <meta name="theme-color" content="#16203a">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/berkshire-swash-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/libre-caslon-text-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <div class="hanger">
      <svg class="ribbon" viewBox="0 0 240 90" aria-hidden="true" focusable="false">
        <path class="ribbon-band" d="M120,12 L58,90 L76,90 L120,24 L164,90 L182,90 Z"/>
        <circle class="nail" cx="120" cy="12" r="5"/>
      </svg>
      <div class="tag" data-tag>
        <span class="tag-string" aria-hidden="true"></span>
        <span class="tag-hole" aria-hidden="true"></span>
        <p class="tag-line" data-tag-line>&nbsp;</p>
        <p class="tag-sub" data-tag-sub>&nbsp;</p>
        <button type="button" class="tag-link" data-open-list>List of doors</button>
      </div>
    </div>

    <div class="calendar">
      <div class="sheet">
        <div class="scene" data-scene>
          <div class="doors" data-doors role="group" aria-label="The doors of the calendar"></div>
        </div>
        <button type="button" class="pencil preview-note" data-preview-note hidden></button>
      </div>
    </div>
  </main>

  <dialog class="film" data-film aria-labelledby="film-title">
    <article class="film-card">
      <button type="button" class="printed-x" data-close aria-label="Close">&times;</button>
      <div class="film-picture">
        <span class="film-day" data-f-day></span>
        <div class="film-emblem" data-f-emblem></div>
      </div>
      <div class="film-text">
        <p class="film-date" data-f-date></p>
        <h2 class="film-title" id="film-title" data-f-title></h2>
        <p class="film-credit" data-f-credit></p>
        <p class="film-as" data-f-as></p>
        <p class="film-logline" data-f-logline></p>
        <p class="film-note" data-f-note></p>
        <div class="film-foot">
          <button type="button" class="seen" role="checkbox" aria-checked="false" data-seen>
            <svg class="seen-box" viewBox="0 0 34 34" aria-hidden="true" focusable="false">
              <rect x="4" y="6" width="22" height="22" rx="1"/>
              <path class="pencil-tick" d="M7,18 C10,20 12,23 14,27 C17,18 23,9 31,3"/>
            </svg>
            <span>Seen it</span>
          </button>
          <a class="film-wiki" data-f-wiki target="_blank" rel="noopener">Read more on Wikipedia</a>
        </div>
      </div>
    </article>
  </dialog>

  <dialog class="doorlist" data-list aria-labelledby="list-title">
    <article class="list-card">
      <button type="button" class="printed-x" data-close aria-label="Close">&times;</button>
      <h2 class="list-title" id="list-title">The doors</h2>
      <ol class="list" data-list-items></ol>
      <button type="button" class="pencil list-reset" data-reset hidden>close all my doors again</button>
    </article>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
